name: SACCO ICT Job Scraper

on:
  schedule:
    # Runs every hour, every day (UTC — EAT is UTC+3)
    - cron: "0 * * * *"
  workflow_dispatch:   # allows manual trigger from GitHub UI

jobs:
  scrape-jobs:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout repo ──────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Restore seen-jobs cache (so we don't re-email old jobs) ────────
      - name: Restore seen jobs cache
        uses: actions/cache@v4
        with:
          path: seen_jobs.json
          key: seen-jobs-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            seen-jobs-${{ runner.os }}-

      # ── 3. Set up Python ──────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ── 4. Install dependencies ───────────────────────────────────────────
      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── 5. Run scraper ────────────────────────────────────────────────────
      - name: Run SACCO ICT Job Scraper
        env:
          KIMI_API_KEY:      ${{ secrets.KIMI_API_KEY }}
          SENDER_EMAIL:      ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD:   ${{ secrets.SENDER_PASSWORD }}
          RECIPIENT_EMAIL:   ${{ secrets.RECIPIENT_EMAIL }}
        run: python scraper.py

      # ── 6. Save updated seen-jobs cache ───────────────────────────────────
      - name: Save seen jobs cache
        uses: actions/cache@v4
        if: always()
        with:
          path: seen_jobs.json
          key: seen-jobs-${{ runner.os }}-${{ github.run_id }}
