name: SACCO ICT Job Scraper

on:
  schedule:
    # Runs every hour, every day (UTC — EAT is UTC+3)
    - cron: "0 * * * *"
  workflow_dispatch:   # allows manual trigger from GitHub UI

jobs:
  scrape-jobs:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout repo ──────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Restore seen-jobs and sent-jobs cache ───────────────────────────
      - name: Restore jobs cache
        uses: actions/cache@v4
        with:
          path: |
            seen_jobs.json
            sent_jobs_*.json
          key: jobs-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            jobs-cache-${{ runner.os }}-

      # ── 3. Set up Python ──────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ── 4. Install dependencies ───────────────────────────────────────────
      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── 5. Run scraper ────────────────────────────────────────────────────
      - name: Run SACCO ICT Job Scraper
        env:
          SENDER_EMAIL:      ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD:   ${{ secrets.SENDER_PASSWORD }}
          RECIPIENT_EMAIL:   ${{ secrets.RECIPIENT_EMAIL }}
        run: python sacco_scraper.py

      # ── 6. Save updated jobs cache ────────────────────────────────────────
      - name: Save jobs cache
        uses: actions/cache@v4
        if: always()
        with:
          path: |
            seen_jobs.json
            sent_jobs_*.json
          key: jobs-cache-${{ runner.os }}-${{ github.run_id }}
